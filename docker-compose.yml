services:
  postgres:
    image: postgres:latest
    restart: "always"
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql
    networks:
      - backend

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - backend
    environment:
          ADMINER_DEFAULT_SERVER: db

  # api:
  #   build:
  #     dockerfile: ./apps/api/Dockerfile
  #     context: .
  #   ports:
  #     - 5000:5000
  #   env_file:
  #     - ./apps/api/.env
  #   volumes:
  #     - ./:/usr/src/app
  #     - /usr/src/app/node_modules
  #   networks:
  #     - backend

networks:
  backend:
    driver: bridge

volumes:
  pg_data:
    driver: local